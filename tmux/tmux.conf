# Nvim compatibility
set -s escape-time 10
set -g focus-events on
set -g status-position top
set -sa terminal-features ",xterm-256color:RGB"

set -g default-shell /usr/bin/fish
set -g detach-on-destroy no-detached

# vi keys in copy mode and the command prompt (tmux only guesses vi from
# $EDITOR, which isn't set yet when fish starts the server)
set -g mode-keys vi
set -g status-keys vi

# Send prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Mouse mode
set -g mouse on

# Scrollback per pane (default 2000)
set -g history-limit 50000

# Set window split keys
unbind %
bind v split-window -h -c "#{pane_current_path}"
unbind '"'
bind h split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

bind C-o display-popup -E "tmux-use session setup"
bind C-k display-popup -E "tmux-use session teardown"

bind g display-popup -E "$HOME/.config/tmux/scripts/gitmojis/select-gitmoji.sh"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'

# catppuccin config
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_status_style "basic"
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Navigation config
set -g @plugin 'aserowy/tmux.nvim'
set -g @tmux-nvim-navigation-cycle false

set -g @tmux-nvim-navigation-keybinding-left 'C-Left'
set -g @tmux-nvim-navigation-keybinding-down 'C-Down'
set -g @tmux-nvim-navigation-keybinding-up 'C-Up'
set -g @tmux-nvim-navigation-keybinding-right 'C-Right'

set -g @tmux-nvim-resize-keybinding-left 'S-Left'
set -g @tmux-nvim-resize-keybinding-down 'S-Down'
set -g @tmux-nvim-resize-keybinding-up 'S-Up'
set -g @tmux-nvim-resize-keybinding-right 'S-Right'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
